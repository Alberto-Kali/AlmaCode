[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "almacode"
version = "0.1.0"
description = "Local GGUF coding agent powered by llama.cpp"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Alberto Kali" }
]
dependencies = [
  "llama-cpp-python>=0.3.0",
  "rich>=13.7.1"
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.11.0",
  "pytest>=8.3.0",
  "ruff>=0.11.0"
]

[project.scripts]
almacode = "almacode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/almacode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
