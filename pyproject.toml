[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "almacode"
version = "0.5.4"
description = "CLI coding agent for llama-server"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Alberto Kali" }
]
dependencies = [
  "rich>=13.7.1",
  "textual>=0.79.0"
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.11.0",
  "pytest>=8.3.0",
  "ruff>=0.11.0"
]

[project.scripts]
almacode = "almacode.cli:main"
almacode-server = "almacode_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/almacode", "src/almacode_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
