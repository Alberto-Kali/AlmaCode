name: release-build

on:
  push:
    branches:
      - release
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check_name: release-linux
            artifact_name: almacode-linux
          - os: macos-latest
            check_name: release-macos
            artifact_name: almacode-macos
          - os: windows-latest
            check_name: release-windows
            artifact_name: almacode-windows
    name: ${{ matrix.check_name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install llama-cpp-python wheel
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            pip install --prefer-binary llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/metal
          else
            pip install --prefer-binary llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          fi

      - name: Install project
        run: pip install -e ".[dev]" --no-deps

      - name: Run tests
        run: pytest

      - name: Build binary
        run: python scripts/build_binary.py

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
