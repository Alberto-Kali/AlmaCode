name: dev-build

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  dev-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install llama-cpp-python wheel
        run: pip install --prefer-binary llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Install project
        run: pip install -e ".[dev]" --no-deps

      - name: Run tests
        run: pytest

      - name: Build one-file binary
        run: python scripts/build_binary.py

      - name: Upload smoke binary
        uses: actions/upload-artifact@v4
        with:
          name: dev-binary
          path: dist/*
